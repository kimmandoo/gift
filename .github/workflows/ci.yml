name: Flutter desktop CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release(') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Run formatter, analyzer, and tests
        run: dart run tool/verify.dart

  build:
    name: Build (${{ matrix.target }})
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release(') }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: gitflu-linux-x64
            path: build/linux/x64/release/bundle/
          - os: macos-latest
            target: macos
            artifact: gitflu-macos
            path: build/macos/Build/Products/Release/branchline.app
          - os: windows-latest
            target: windows
            artifact: gitflu-windows-x64
            path: build/windows/x64/runner/Release/
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build release bundle
        if: matrix.target != 'windows'
        shell: bash
        run: ./tool/build_${{ matrix.target }}.sh
      - name: Build Windows release bundle
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./tool/build_windows.ps1
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
