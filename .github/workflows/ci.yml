name: Flutter desktop CI

on:
  push:
    tags: ['release-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          [[ "$subject" == release\(*\):* ]]
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Check toolchain
        run: |
          flutter --version
          dart --version
          git --version

      - name: Run formatter, analyzer, and tests
        run: dart run tool/verify.dart

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: gift-linux-x64
            path: build/linux/x64/release/bundle/
          - os: macos-latest
            target: macos
            artifact: gift-macos
            path: build/macos/Build/Products/Release/gift.app
          - os: windows-latest
            target: windows
            artifact: gift-windows-x64
            path: |
              build/windows/x64/runner/Release/
              build/windows/x64/runner/gift-portable.exe
              build/windows/x64/runner/gift-setup.exe
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Verify Windows packaging scripts
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./tool/windows_packaging_test.ps1

      - name: Build release bundle
        if: matrix.target != 'windows'
        shell: bash
        run: ./tool/build_${{ matrix.target }}.sh
      - name: Build Windows release bundle
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./tool/build_windows.ps1
      - name: Capture platform visual goldens
        if: matrix.target != 'windows'
        env:
          GIFT_CAPTURE_GOLDENS: '1'
        run: flutter test --update-goldens test/app/visual_regression_test.dart
      - name: Upload platform visual goldens
        if: matrix.target != 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gift-${{ matrix.target }}-visual-goldens
          path: test/app/goldens/${{ matrix.target }}/
          if-no-files-found: error

      - name: Verify release artifact
        run: dart run tool/verify_desktop_artifact.dart ${{ matrix.target }}
      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
